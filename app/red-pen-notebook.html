<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紅筆英文本</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a ruled notebook page. Black pen = the plain phrase, red pen = the upgrade. */
:root{
  --paper:#fbfbf8; --paper2:#f0f0ea; --rule:#cdd6e3; --ink:#1d1f24; --ink2:#5b6270;
  --red:#d42b2b; --red-bg:#fdeceb; --ok:#1f7a4d; --bad:#b4231f; --line:#dcdcd2;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --body:"IBM Plex Sans","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16181d; --paper2:#1f2229; --rule:#2c3644; --ink:#ecebe6; --ink2:#9aa1ad;
    --red:#ff6b6b; --red-bg:#2e1c1f; --ok:#5fd19a; --bad:#ff8a85; --line:#2d3038; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#16181d; --paper2:#1f2229; --rule:#2c3644; --ink:#ecebe6; --ink2:#9aa1ad;
  --red:#ff6b6b; --red-bg:#2e1c1f; --ok:#5fd19a; --bad:#ff8a85; --line:#2d3038; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 56px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font:700 34px/1 var(--hand);margin:0;color:var(--red);text-wrap:balance}
h1 span{color:var(--ink)}
.prog{font-size:13px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;width:110px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
nav button{flex:1;white-space:nowrap;background:none;border:0;border-bottom:3px solid transparent;padding:10px 6px;font:500 15px var(--body);color:var(--ink2);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.panel[hidden],#sub[hidden]{display:none}
.count{font-size:13px;color:var(--ink2);margin-bottom:8px;font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.card{display:block;position:relative;width:100%;height:270px;padding:0;border:0;background:none;cursor:pointer;color:inherit;font:inherit;text-align:left}
.face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:22px 24px;border:1px solid var(--line);border-radius:10px;
  background:var(--paper2) repeating-linear-gradient(to bottom,transparent 0 35px,var(--rule) 35px 36px);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .5s;overflow:auto}
.front{transform:perspective(900px) rotateY(0)}
.back{transform:perspective(900px) rotateY(180deg)}
.flipped .front{transform:perspective(900px) rotateY(-180deg)}
.flipped .back{transform:perspective(900px) rotateY(0)}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em}
.tag.ink{color:var(--ink2)} .tag.red{color:var(--red)}
.big{font:700 38px/1.1 var(--hand);text-wrap:balance}
.ink-t{color:var(--ink)} .red-t{color:var(--red)}
.zh{font-size:17px;font-weight:500}
.ex{font-size:15px;color:var(--ink2)}
mark{background:none;color:var(--red);font-weight:600}
.hint{font-size:12px;color:var(--ink2)}
.bk{margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--paper2)}
.bk>summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font:700 24px/1 var(--hand);color:var(--red);list-style:none}
.bk>summary::-webkit-details-marker{display:none}
.bk>summary::before{content:'\25B8';font:12px var(--body);color:var(--ink2);margin-right:8px;display:inline-block;transition:transform .15s}
.bk[open]>summary::before{transform:rotate(90deg)}
.bk>summary b{flex:1}
.bk[open]>summary{border-bottom:1px solid var(--line)}
.bk>.wi,.bk>.item,.bk>.ser{margin:8px}
.known{position:absolute;top:10px;right:12px;font-size:12px;color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{flex:1 1 auto;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 15px var(--body);cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.cta{width:100%;min-height:56px;font-size:17px;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px;min-height:48px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 16px var(--body);cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--paper))}
.q{font:700 32px/1.15 var(--hand);margin:6px 0 8px;text-wrap:balance}
.fb{margin-top:14px;padding:12px 14px;border-left:3px solid var(--red);background:var(--red-bg);border-radius:0 8px 8px 0;font-size:15px}
.fb b{color:var(--red)}
.filter{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--ink2)}
.filter input{width:20px;height:20px;accent-color:var(--red)}
.empty{padding:20px 0;color:var(--ink2)}
.prompt{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;padding:14px 16px;background:var(--paper2)}
.prompt p{margin:0 0 6px}
.prompt .req{font-size:14px;color:var(--ink2);margin:0}
textarea{width:100%;min-height:210px;margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:17px/1.7 var(--body);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.chip.on{border-color:var(--red);background:var(--red-bg);color:var(--red);font-weight:600}
.tgs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tg{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--ink2)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:8px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .t{font-weight:600;color:var(--red)}
.item .p{font-size:13px;color:var(--ink2)}
.item .z{font-size:14px;grid-column:1}
.item .e{font-size:14px;font-style:italic;color:var(--ink2);grid-column:1}
.item .e.none{font-style:normal;opacity:.6}
.sib{display:block;font-size:13px;color:var(--ink2);margin-top:6px}
.item .sib,.item .tgs,.item .ipa{grid-column:1}
.item .pd{grid-column:1;font-size:13px;color:var(--ink2)}
.pd summary{cursor:pointer;min-height:28px}
.pd span{display:block;margin-top:4px}
.ipa{font-size:13px;color:var(--ink2)}
.item button{grid-row:1 / span 5;grid-column:2;align-self:center;background:none;border:1px solid var(--line);border-radius:6px;color:var(--ink2);min-height:36px;padding:0 10px;cursor:pointer;font:13px var(--body)}
.ser{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:8px;padding:2px 12px;margin:12px 0;background:var(--paper2)}
.ser-h{font-size:13px;font-weight:600;padding:8px 0 0;color:var(--red)}
.ser .item:last-child{border-bottom:0}
form{display:grid;gap:10px;margin-bottom:22px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--paper2)}
form h2,.list-h{font:700 24px var(--hand);margin:0}
label{display:grid;gap:4px;font-size:13px;color:var(--ink2)}
input[type=text]{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:16px var(--body);width:100%}
select{min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:16px var(--body);width:100%}
.ibform{display:flex;gap:8px;margin-bottom:14px}
.ib{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--paper)}
.ib-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ib-p{font:700 24px/1.2 var(--hand);color:var(--ink);overflow-wrap:anywhere}
.ib-acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;flex:0 0 auto}
.sug{display:grid;gap:3px;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.sug .st{font:700 24px/1.15 var(--hand);color:var(--red)}
.sug .sm2{font-size:13px;color:var(--ink2)}
.sug .btn{justify-self:start;margin-top:4px}
.sm2{font-size:13px;color:var(--ink2)}
.tr{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:var(--paper2)}
.tr .w{font:700 30px/1.1 var(--hand);color:var(--red);overflow-wrap:anywhere}
.tr .zz{font-size:16px;font-weight:600}
.tr .dd{font-size:14px;color:var(--ink2)}
.tr .row{margin-top:10px}
.rv{position:relative;width:100%;height:330px}
.rv.tall{height:420px}
details.wi{border-bottom:1px solid var(--line);padding:6px 0}
details.wi summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;min-height:40px}
.wi-w{font:700 24px var(--hand);color:var(--red)}
details.wi summary{flex-wrap:wrap}
.gap-t{margin-left:auto;font-size:12px;color:var(--bad);border:1px solid var(--bad);border-radius:999px;padding:0 8px;white-space:nowrap}
.ok-t{margin-left:auto;font-size:12px;color:var(--ok);white-space:nowrap}
.mk{font-size:11px;color:var(--ink2);margin-left:3px}
.wi-b{display:grid;gap:4px;padding:2px 0 8px;font-size:14px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink2);margin-top:18px}
.pk{cursor:pointer;min-height:36px;background:var(--paper);font:13px var(--body)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 0 14px}
.seg button{flex:1;min-height:40px;border:0;background:var(--paper);color:var(--ink2);font:500 14px var(--body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper2)}
.stat b{display:block;font:700 26px/1.1 var(--hand);color:var(--red);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.doc{border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden}
.doc-h{display:flex;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--paper2);border-bottom:1px solid var(--line);font-size:13px}
.doc-h span{color:var(--ink2)}
.doc p{margin:0;padding:12px 14px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere}
del{background:var(--red-bg);color:var(--red);text-decoration:line-through;border-radius:3px}
ins{background:color-mix(in srgb,var(--ok) 16%,var(--paper));color:var(--ok);text-decoration:none;font-weight:500;border-radius:3px}
.fb ul{margin:6px 0 0;padding-left:18px}
details.add{margin-top:20px}
details.add summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
form textarea{min-height:110px;margin-top:0;font-size:15px;line-height:1.6}
.wrap.wide{max-width:980px}
.gbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:10px}
.gbar label{display:inline-flex;gap:5px;align-items:center}
.gbar select{min-height:36px;width:auto}
#gbox{height:min(62vh,560px);min-height:360px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);overflow:hidden}
#gsvg{display:block;width:100%;height:100%;cursor:grab}
.gn{cursor:pointer}
.gn text{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--paper2);stroke-width:3px;pointer-events:none}
.gn.h text{font-weight:700;font-size:12px}
.gring{display:none;fill:none;stroke:var(--ink);stroke-width:2}
.gn.sel .gring{display:block}
.gdim{opacity:.15}
.gl{stroke:var(--ink2);stroke-opacity:.4}
.gleg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--ink2)}
.gleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.glg{cursor:pointer}
.glg.on{color:var(--ink);font-weight:600;text-decoration:underline}
.gfade{opacity:.12}
.gbar input[type=range]{width:90px;accent-color:var(--red)}
#gdetail{margin-top:12px}
@media (prefers-reduced-motion:reduce){.face,.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>紅筆<span>英文本</span></h1>
    <div class="prog"><div id="progText">已掌握 0 / 0</div><div class="bar"><i id="progBar"></i></div><button id="bkBtn" type="button" style="margin-top:6px;font-size:12px;padding:3px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer">匯出備份 JSON</button><button id="imBtn" type="button" style="margin:6px 0 0 6px;font-size:12px;padding:3px 10px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer">匯入備份 JSON</button><input id="imFile" type="file" accept=".json,application/json" style="display:none"></div>
  </header>
  <nav role="tablist" aria-label="功能">
    <button role="tab" id="t-today" aria-selected="true" data-g="today">今日</button>
    <button role="tab" id="t-drill" aria-selected="false" data-g="drill">練習</button>
    <button role="tab" id="t-write" aria-selected="false" data-g="write">寫作</button>
    <button role="tab" id="t-lib" aria-selected="false" data-g="lib">收藏庫</button>
  </nav>
  <div id="sub" class="seg" role="group" aria-label="子分頁" hidden></div>
  <section class="panel" id="p-today" role="tabpanel" aria-labelledby="t-today"></section>
  <section class="panel" id="p-flash" role="tabpanel" hidden></section>
  <section class="panel" id="p-quiz" role="tabpanel" hidden></section>
  <section class="panel" id="p-essay" role="tabpanel" hidden></section>
  <section class="panel" id="p-comp" role="tabpanel" hidden></section>
  <section class="panel" id="p-deck" role="tabpanel" hidden></section>
  <section class="panel" id="p-daily" role="tabpanel" hidden></section>
  <section class="panel" id="p-inbox" role="tabpanel" hidden></section>
  <section class="panel" id="p-graph" role="tabpanel" hidden></section>
  <p class="note" id="syncNote">進度會存在這個瀏覽器；連上資料庫時也會同步備份，換裝置可以接續。</p>
</div>

  function diffOps(a,b){
    var n=a.length,m=b.length,dp=[],i,j;
    for(i=0;i<=n;i++)dp.push(new Uint16Array(m+1));
    for(i=n-1;i>=0;i--)for(j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
    var ops=[];i=0;j=0;
    while(i<n&&j<m){
      if(a[i]===b[j]){ops.push(['eq',a[i]]);i++;j++}
      else if(dp[i+1][j]>=dp[i][j+1]){ops.push(['del',a[i]]);i++}
      else{ops.push(['ins',b[j]]);j++}
    }
    while(i<n){ops.push(['del',a[i++]])}
    while(j<m){ops.push(['ins',b[j++]])}
    return ops;
  }

  gnodes.forEach(function(n){if(n.x<x0)x0=n.x;if(n.x>x1)x1=n.x;if(n.y<y0)y0=n.y;if(n.y>y1)y1=n.y});
  if(!isFinite(x0)||!isFinite(y0))return;
  var w=(x1-x0)+160,h=(y1-y0)+90;
  var k=Math.max(.15,Math.min(1.6,Math.min(gW/w,gH/h)));
  var cx=(x0+x1)/2+30,cy=(y0+y1)/2;
  gsvg.transition().duration(450).call(gzoom.transform,d3.zoomIdentity.translate(gW/2-k*cx,gH/2-k*cy).scale(k));
}
function gMark(){if(typeof d3==='undefined')return;d3.selectAll('#gsvg g.gn').classed('sel',function(d){return d.id===gs.sel});gFocus()}
function gDetail(){
  var el=$('#gdetail');if(!el)return;
  var n=gs.sel&&gNodes[gs.sel];
  if(!n){el.innerHTML='<p class="sm2">點圓點看內容，點方塊看這個分類裡有誰。換「顏色依」或勾選不同樞紐，可以從不同面向看同一批詞。</p>';return}
  if(n.t==='h'){
    el.innerHTML='<div class="ib"><div class="tag ink">'+esc(n.fl)+'</div><div class="ib-p">'+esc(n.label)+'</div><p class="sm2" style="margin:4px 0">'+n.members.length+' 個成員</p>'+
      n.members.map(function(id){var m=gNodes[id];return m?'<span class="chip pk'+(gWeak(m)?' on':'')+'" data-gsel="'+esc(id)+'">'+esc(m.label)+'</span>':''}).join('')+'</div>';
    return;
  }
  var it=n.item,st=gMast(n.key)+(gWeak(n)?' · 待加強':'')+(gUnv(n)?' · 尚未核對':'');
  if(n.kind==='p'){
    el.innerHTML='<div class="ib"><div class="tag ink">片語 · '+esc(it.r||'')+' · '+esc(st)+'</div><div class="ib-p" style="color:var(--red)">'+esc(it.t)+'</div>'+
      '<div class="zh">'+esc(it.z||'')+'</div>'+(it.p?'<div class="sm2">原本的說法：'+esc(it.p)+'</div>':'')+
      (it.e?'<div class="ex">'+hl(it)+'</div>':'')+gMeta(n)+sibTag(it)+pTag(it)+'</div>';
  }else{
    el.innerHTML='<div class="ib"><div class="tag ink">單字 · '+esc(it.l||'')+' · '+esc(st)+'</div><div class="ib-p" style="color:var(--red)">'+esc(it.w)+'</div><div class="sm2">'+pron(it)+'</div>'+
      '<div class="zh">'+esc(it.z||'')+'</div><div class="sm2">'+esc(it.g||'')+'</div>'+(it.e?'<div class="ex" style="font-style:italic">'+esc(it.e)+'</div>':'')+gMeta(n)+tgHtml(it.tg)+wDetail(it)+'</div>';
  }
}
function renderGraph(){
  var el=$('#p-graph');
  var opts=GCOL.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===gs.color?' selected':'')+'>'+c[1]+'</option>'}).join('');
  var cks=GHUB.map(function(h){return '<label><input type="checkbox" data-ghub="'+h[0]+'"'+(gs.hubs[h[0]]?' checked':'')+'> '+h[1]+'</label>'}).join('');
  el.innerHTML='<div class="seg" role="group" aria-label="圖譜範圍"><button data-gscope="p" aria-pressed="'+(gs.scope==='p')+'">片語圖譜</button><button data-gscope="w" aria-pressed="'+(gs.scope==='w')+'">單字圖譜</button></div>'+
    '<div class="gbar"><label>顏色依 <select id="gcol">'+opts+'</select></label><span>分類方塊：</span>'+cks+'</div>'+
    '<div class="gbar"><label>引力 <input type="range" id="ggrav" min="0" max="40" value="'+gs.grav+'"></label><label>斥力 <input type="range" id="grep" min="40" max="400" value="'+gs.rep+'"></label><button class="btn sm" id="gfit" type="button">全覽</button><button class="btn sm" id="gcls" type="button">補難度與情境</button><span id="gmsg" class="sm2"></span></div>'+
    '<div id="gbox"><svg id="gsvg"></svg></div><div class="gleg" id="gleg"></div><div id="gdetail"></div>';
  gDraw();gDetail();gCover();
}
$('#p-graph').addEventListener('change',function(e){
  if(e.target.id==='gcol'){gs.color=e.target.value;gs.focus='';gDraw();gDetail()}
  else if(e.target.getAttribute('data-ghub')){gs.hubs[e.target.getAttribute('data-ghub')]=e.target.checked;gs.sel=null;gDraw();gDetail()}
});
$('#p-graph').addEventListener('click',function(e){
  var c=e.target.closest('[data-gsel]');if(c){gs.sel=c.getAttribute('data-gsel');gDetail();gMark()}
});
$('#p-graph').addEventListener('input',function(e){
  if(e.target.id!=='ggrav'&&e.target.id!=='grep')return;
  gs.grav=+$('#ggrav').value;gs.rep=+$('#grep').value;
  if(gsim){gsim.force('x').strength(gs.grav/100);gsim.force('y').strength(gs.grav/100);gsim.force('charge').strength(-gs.rep);gs.fitPending=true;gs.ticks=0;gsim.alpha(.7).restart()}
});
$('#p-graph').addEventListener('click',function(e){
  var sp=e.target.closest('[data-gscope]');if(sp){gSwitch(sp.getAttribute('data-gscope'));return}
  if(e.target.closest('#gfit')){gFit();return}
  if(e.target.closest('#gcls')){gClassify();return}
  var lg=e.target.closest('[data-gleg]');
  if(lg){var v=lg.getAttribute('data-gleg');gs.focus=gs.focus===v?'':v;document.querySelectorAll('#gleg .glg').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-gleg')===gs.focus)});gFocus()}
});
window.addEventListener('resize',function(){if(cur==='graph')gDraw()});

/* ---------- start ---------- */
  initState();
  renderProg();show('today');loadDb();
})();
</script>
<script>
(function(){
  var btn=document.getElementById('bkBtn');if(!btn)return;
  btn.addEventListener('click',async function(){
    var db=window.__rpDb;
    if(!db){btn.textContent='資料庫尚未連線';return}
    btn.disabled=true;btn.textContent='匯出中…';
    var out={exportedAt:new Date().toISOString(),collections:{}};
    var names=['etym','phr','rec','pending','col','state'];
    try{
      for(var i=0;i<names.length;i++){
        var snap=await db.collection(names[i]).get();
        out.collections[names[i]]=snap.docs.map(function(d){return {id:d.id,data:d.data()}});
      }
      out.counts={};names.forEach(function(n){out.counts[n]=out.collections[n].length});
      var txt=JSON.stringify(out);
      var day=new Date().toISOString().slice(0,10);
      try{
        var dl=await claude.use('downloads');
        if(!dl)throw new Error('no downloads');
        await dl.save({filename:'redbook-backup-'+day+'.json',data:txt});
        btn.textContent='已匯出（'+Object.keys(out.counts).map(function(n){return n+' '+out.counts[n]}).join('、')+'）';
      }catch(e){
        try{await navigator.clipboard.writeText(txt);btn.textContent='無法下載，已複製到剪貼簿'}catch(e2){btn.textContent='匯出失敗：瀏覽器不允許下載'}
      }
    }catch(e){btn.textContent='匯出失敗：'+(e&&e.message?e.message:e)}
    btn.disabled=false;
  });
})();
</script>
<script>
(function(){
  var b=document.getElementById('imBtn'),f=document.getElementById('imFile');if(!b||!f)return;
  b.addEventListener('click',function(){if(!window.__rpDb){b.textContent='資料庫尚未連線';return}f.value='';f.click()});
  f.addEventListener('change',async function(){
    var file=f.files&&f.files[0];if(!file)return;
    var db=window.__rpDb;if(!db){b.textContent='資料庫尚未連線';return}
    try{
      var o=JSON.parse(await file.text());
      var cols=o&&o.collections;if(!cols)throw new Error('不是備份檔');
      var names=Object.keys(cols),total=0;names.forEach(function(n){total+=cols[n].length});
      if(!confirm('將匯入 '+total+' 筆資料，並覆蓋同名資料。確定嗎？'))return;
      b.disabled=true;var done=0,fail=0;
      for(var i=0;i<names.length;i++){
        var arr=cols[names[i]];
        for(var j=0;j<arr.length;j+=15){
          await Promise.all(arr.slice(j,j+15).map(function(x){return db.doc(names[i]+'/'+x.id).set(x.data).then(function(){done++},function(){fail++})}));
          b.textContent='匯入中 '+(done+fail)+' / '+total;
        }
      }
      try{localStorage.setItem('rp-seeded','1');localStorage.removeItem('rp-ts')}catch(e){}
      b.textContent='完成：成功 '+done+'、失敗 '+fail+(fail?'（etym 需擁有者權限）':'')+'，重新載入…';
      setTimeout(function(){location.reload()},1500);
    }catch(e){b.textContent='匯入失敗：'+(e&&e.message?e.message:e)}
    b.disabled=false;
  });
})();
</script>
